
name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test IPP protocol codec
        run: |
          mkdir -p build/ipp-codec-test
          javac -d build/ipp-codec-test app/src/main/java/dev/sunmibridge/Ipp.java tests/IppCodecSmokeTest.java
          java -cp build/ipp-codec-test IppCodecSmokeTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sunmi-v2-network-printer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
